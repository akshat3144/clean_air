[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanair"
version = "0.1.0"
description = "Deconfounded tyre degradation estimation - separating true tyre wear from fuel load, traffic and track evolution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Team Pit Wall" }]
keywords = ["formula1", "motorsport", "tyre-degradation", "mixed-effects", "bayesian", "wear-estimation"]

# NOTE: pandas is pinned below 3.0 because fastf1 3.8.3 requires it.
# This machine has pandas 3.0 installed globally, which is why the venv exists.
dependencies = [
    "fastf1==3.8.3",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scoringrules>=0.11",
    "arviz>=1.0",
    "cmdstanpy>=1.2",
    "matplotlib>=3.8",
    "pyarrow>=15",
]

[project.optional-dependencies]
lab = ["streamlit>=1.30"]
gbm = ["lightgbm>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/team-pit-wall/cleanair"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cleanair = ["models/stan/*.stan", "models/stan/*.stanfunctions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Tests that need network or a Stan compile are marked and skipped by default.
markers = [
    "network: requires internet (FastF1 pull)",
    "stan: requires a compiled Stan model",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
